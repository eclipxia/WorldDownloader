plugins {
	id 'java'
	id 'maven-publish'
	id 'net.fabricmc.fabric-loom' version '1.19.3' apply false
	id 'net.fabricmc.fabric-loom-remap' version '1.19.3' apply false
}

import java.util.Properties

// Select the Minecraft version with -Pmc=<version>. Each version gets its own jar,
// built from common/ + version/<version> (version specific shims).
def mc = (project.findProperty('mc') ?: project.default_mc) as String
def vprops = new Properties()
file("version/${mc}/version.properties").withInputStream { vprops.load(it) }
def unobf = vprops.getProperty('unobfuscated') == 'true'
def javaVer = vprops.getProperty('java_version')
def parchmentVer = vprops.getProperty('parchment_version')


apply plugin: (unobf ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap')

def pluginVersion = project.version as String
project.version = "${pluginVersion}+${mc}"
group = project.maven_group
base.archivesName = project.plugin_name

configurations {
	rusherhackApi
	compileOnly.extendsFrom(rusherhackApi)
	productionRuntime {
		extendsFrom configurations.minecraftLibraries
		extendsFrom configurations.loaderLibraries
		extendsFrom configurations.minecraftRuntimeLibraries
	}
}

repositories {
	maven { name = 'rusherhack'; url = 'https://maven.rusherhack.org/snapshots' }
	maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
}

dependencies {
	minecraft "com.mojang:minecraft:${mc}"
	if (!unobf) {
		mappings loom.layered() {
			officialMojangMappings()
			if (parchmentVer) parchment("org.parchmentmc.data:parchment-${parchmentVer}@zip")
		}
		modImplementation("net.fabricmc:fabric-loader:${project.fabric_loader_version}")
	} else {
		implementation("net.fabricmc:fabric-loader:${project.fabric_loader_version}")
	}
	rusherhackApi "org.rusherhack:rusherhack-api:${mc}-SNAPSHOT"
}

sourceSets.main.java.setSrcDirs(["common/java", "version/${mc}/java"])
sourceSets.main.resources.setSrcDirs(["common/resources", "version/${mc}/resources"])

java {
	sourceCompatibility = JavaVersion.toVersion(javaVer)
	targetCompatibility = JavaVersion.toVersion(javaVer)
	toolchain.languageVersion.set(JavaLanguageVersion.of(javaVer as int))
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = javaVer as int
}

processResources {
	inputs.property 'mc', mc
	filesMatching("rusherhack-plugin.json") {
		expand(project: project, mc: mc, pluginVersion: pluginVersion)
	}
}

jar {
	manifest { attributes("Minecraft-Version": mc) }
}

tasks.register('updateAccessWidener', Copy) {
	group = "build"
	outputs.upToDateWhen { false }
	def aw = zipTree(configurations.rusherhackApi.singleFile).matching { include "rusherhack.accesswidener" }
	from(aw)
	into(file("build/tmp/${mc}"))
}

loom {
	def awFile = file("build/tmp/${mc}/rusherhack.accesswidener")
	if (awFile.exists()) accessWidenerPath = awFile
	runConfigs.configureEach { ideConfigGenerated = false }
}
